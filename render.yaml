# Render Blueprint: Nestly on Render's FREE web plan, with its data in a free hosted Turso database.
# https://render.com/docs/blueprint-spec
#
# Free web services have no persistent disk, so the database lives in Turso instead (https://turso.tech, free tier).
# Free services also sleep after ~15 minutes without traffic and take a few seconds to wake up — that's fine
# for Nestly: allowances are caught up as soon as anyone opens the app.
services:
  - type: web
    name: nestly
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: TRUST_PROXY
        value: "1"                 # Render terminates TLS: Secure cookies + client IPs from X-Forwarded-*
      - key: TURSO_DATABASE_URL
        sync: false                # you paste this in the Render dashboard (libsql://…)
      - key: TURSO_AUTH_TOKEN
        sync: false                # and this
